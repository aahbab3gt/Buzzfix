<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BuzzFix — report it in one photo</title>
<style>
  :root{
    --navy:#003057; --navy2:#00223e; --gold:#B3A369; --gold2:#d9c98a;
    --bg:#f4f2ec; --card:#ffffff; --ink:#1b2430; --muted:#5b6673;
    --ok:#1f8a4c; --warn:#c77700; --bad:#c0392b; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0c1420; --card:#132032; --ink:#eef2f7; --muted:#9aa7b5; --navy:#0f2b4a; }
  }
  :root[data-theme="dark"]{ --bg:#0c1420; --card:#132032; --ink:#eef2f7; --muted:#9aa7b5; --navy:#0f2b4a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px;}
  header{display:flex;align-items:center;gap:10px;padding:18px 0 6px;}
  .bee{width:38px;height:38px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:22px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  h1 span{color:var(--gold)}
  .tag{color:var(--muted);font-size:14px;margin:2px 0 18px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 8px 24px rgba(0,16,40,.08);}
  label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  textarea,select,input[type=text]{width:100%;border:1.5px solid rgba(120,130,150,.3);background:transparent;color:var(--ink);border-radius:12px;padding:12px;font:inherit}
  textarea{min-height:84px;resize:vertical}
  .photo-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--gold);border-radius:var(--radius);padding:22px;cursor:pointer;font-weight:600;color:var(--ink);background:rgba(179,163,105,.08)}
  .photo-btn img{max-width:100%;max-height:220px;border-radius:12px;display:block}
  button.submit{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:600 17px/1 inherit;cursor:pointer}
  button.submit:disabled{opacity:.6}
  .result{margin-top:16px;display:none}
  .ticket{font:700 15px/1 ui-monospace,Menlo,monospace;background:var(--gold);color:#17222e;border-radius:8px;padding:4px 8px;display:inline-block}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(120,130,150,.15)}
  .pill.em{background:var(--bad);color:#fff}
  .pill.high{background:var(--warn);color:#fff}
  .em-box{border:2px solid var(--bad);border-radius:var(--radius);padding:14px;margin-top:10px}
  .em-box b{color:var(--bad)}
  .routed{color:var(--muted);font-size:14px;margin-top:10px}
  a.dash{display:block;text-align:center;color:var(--muted);margin-top:22px;font-size:14px}
  .spin{display:none;text-align:center;color:var(--muted);margin-top:14px}
  .geo{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(120,130,150,.1)}
  .geo-dot{width:9px;height:9px;border-radius:50%;background:#c77700;flex:none;animation:pulse 1.2s infinite}
  .geo.ok .geo-dot{background:var(--ok);animation:none}
  .geo.err .geo-dot{background:var(--bad);animation:none}
  .geo-btn{margin-left:auto;border:1px solid var(--gold);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;font:600 12px inherit;cursor:pointer}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="bee">🐝</div><h1>Buzz<span>Fix</span></h1></header>
  <p class="tag">See something broken at Tech? One photo. We figure out the rest.</p>

  <form class="card" id="f">
    <label>Photo</label>
    <label class="photo-btn" id="pbtn">
      <span id="pprompt">📷 Snap or upload a photo</span>
      <input type="file" name="photo" id="photo" accept="image/*" capture="environment" hidden />
    </label>

    <label>What's wrong? <span style="text-transform:none;font-weight:400">(optional — AI reads the photo)</span></label>
    <textarea name="text" id="text" placeholder="e.g. water fountain leaking all over the floor, 2nd floor near the elevators"></textarea>

    <label>Location</label>
    <div class="geo" id="geo">
      <span class="geo-dot" id="geo-dot"></span>
      <span id="geo-text">Getting your location…</span>
      <button type="button" class="geo-btn" id="geo-retry" hidden>Retry</button>
    </div>
    <input type="hidden" name="lat" id="lat" /><input type="hidden" name="lng" id="lng" /><input type="hidden" name="accuracy" id="accuracy" />

    <label>Building <span style="text-transform:none;font-weight:400">(optional — GPS picks the nearest)</span></label>
    <select name="buildingId" id="building"><option value="">Auto-detect from GPS / photo / text</option></select>

    <label>Where exactly? (optional)</label>
    <input type="text" name="location" id="location" placeholder="Room 1443 / 2nd floor hallway / outside main entrance" />

    <button class="submit" id="go">Report it</button>
    <div class="spin" id="spin">🐝 Triaging with AI…</div>

    <div class="result" id="result"></div>
  </form>

  <a class="dash" href="/dashboard">SGA / Facilities dashboard →</a>
</div>

<script>
const $ = (s) => document.querySelector(s);

fetch("/api/buildings").then(r=>r.json()).then(bs=>{
  for (const b of bs) {
    const o = document.createElement("option");
    o.value = b.id; o.textContent = b.name;
    $("#building").appendChild(o);
  }
});

// Browser GPS: phones strip EXIF location from uploads, so ask the device directly.
function locate() {
  const g = $("#geo"); g.className = "geo"; $("#geo-retry").hidden = true;
  $("#geo-text").textContent = "Getting your location…";
  if (!navigator.geolocation) { geoFail("Location not supported on this device"); return; }
  navigator.geolocation.getCurrentPosition(
    (p) => {
      $("#lat").value = p.coords.latitude; $("#lng").value = p.coords.longitude; $("#accuracy").value = Math.round(p.coords.accuracy);
      g.classList.add("ok");
      $("#geo-text").textContent = `📍 Location captured (±${Math.round(p.coords.accuracy)} m) — we'll pin this on the map`;
    },
    (err) => geoFail(err.code === 1 ? "Location blocked — pick a building below instead" : "Couldn't get location — pick a building below"),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}
function geoFail(msg) { $("#geo").classList.add("err"); $("#geo-text").textContent = msg; $("#geo-retry").hidden = false; }
$("#geo-retry").addEventListener("click", locate);
locate();

$("#photo").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const img = document.createElement("img");
  img.src = URL.createObjectURL(f);
  $("#pprompt").replaceChildren(img);
});

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; $("#spin").style.display = "block";
  $("#result").style.display = "none";
  try {
    const res = await fetch("/api/report", { method: "POST", body: new FormData(e.target) });
    const d = await res.json();
    render(d);
  } catch (err) {
    $("#result").style.display = "block";
    $("#result").innerHTML = `<p>Something went wrong: ${err.message}</p>`;
  } finally {
    btn.disabled = false; $("#spin").style.display = "none";
  }
});

function render(d) {
  const r = d.report;
  const el = $("#result");
  el.style.display = "block";
  if (d.emergency) {
    el.innerHTML = `
      <div class="em-box">
        <b>⚠️ This looks like an emergency.</b>
        <p style="margin:8px 0 2px">Don't wait on a ticket — call now:</p>
        <p style="margin:2px 0;font-weight:700">${d.emergency.call}</p>
        <p style="margin:2px 0;color:var(--muted);font-size:13px">${d.emergency.note}</p>
        <p style="margin:8px 0 0;font-size:13px">Logged as <span class="ticket">${d.ticket}</span> so facilities can follow up.</p>
      </div>`;
    return;
  }
  if (d.merged) {
    el.innerHTML = `
      <p>🙌 ${d.message}</p>
      <div class="row">
        <span class="ticket">${d.ticket}</span>
        <span class="pill">${r.category}</span>
        <span class="pill">▲ ${r.upvotes} reports</span>
      </div>`;
    return;
  }
  el.innerHTML = `
    <p>✅ <b>${r.title}</b></p>
    <div class="row">
      <span class="ticket">${d.ticket}</span>
      <span class="pill">${r.category}</span>
      <span class="pill ${r.urgency === "high" ? "high" : ""}">${r.urgency}</span>
      ${r.building ? `<span class="pill">${r.building.name}</span>` : ""}
    </div>
    ${r.address ? `<p class="routed">📍 <b>${r.address}</b>${r.nearestBuilding ? ` · ${r.nearestBuilding.distanceMeters} m from ${r.nearestBuilding.name}` : ""} · <a href="${r.mapsUrl}" target="_blank" rel="noopener">map</a></p>` : ""}
    <p class="routed">📬 Routed to: <b>${d.routed.label}</b><br/><span style="font-size:13px">${d.routed.why}</span></p>`;
}
</script>
</body>
</html>
